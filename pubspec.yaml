name: expense_tracker
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.0
  path_provider: ^2.1.5
  path: ^1.9.1
  fl_chart: ^0.70.2
  intl: ^0.20.2
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  qr_flutter: ^4.1.0
  share_plus: ^11.0.0
  mobile_scanner: ^7.4.0
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.3.0
  supabase_flutter: ^2.8.0
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0
  url_launcher: ^6.3.1
  pdf: ^3.11.1
  printing: ^5.13.3
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  assets:
    - shorebird.yaml
  uses-material-design: true

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#04245D"
    theme_color: "#04245D"
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/icon/app_icon.png"
